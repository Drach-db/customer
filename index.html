<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketel - Customer Support Platform</title>
    <script>
      // Handle navbar, user state and dark mode before React loads
      try {
        // Handle navbar state
        var uiStored = localStorage.getItem('ui-storage');
        if (uiStored) {
          var uiData = JSON.parse(uiStored);
          if (uiData.state && !uiData.state.isNavbarExpanded) {
            document.documentElement.classList.add('navbar-collapsed');
          }
        }

        // Handle user state
        var userStored = localStorage.getItem('user-storage');
        if (userStored) {
          var userData = JSON.parse(userStored);
          if (userData.state) {
            window.__USER_DATA__ = userData.state;
          }
        }

        // Handle dark mode
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
